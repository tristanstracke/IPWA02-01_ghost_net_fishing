<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template/layout.xhtml">

    <ui:param name="pageTitle" value="Verschollen melden"/>

    <ui:define name="inhalt">
        <h2>Netz als verschollen melden</h2>
        <p class="hinweis">
            Eine Verschollen-Meldung ist nicht anonym möglich – der Name ist
            daher Pflicht.
        </p>

        <h:form>
            <div class="formfeld">
                <h:outputLabel for="netz" value="Netz:"/>
                <h:selectOneMenu id="netz" value="#{verschollenBean.ausgewaehltesNetzId}"
                                 required="true" requiredMessage="Bitte ein Netz auswählen.">
                    <f:selectItem itemLabel="-- bitte wählen --" noSelectionOption="true"/>
                    <f:selectItems value="#{verschollenBean.netze}" var="n"
                                   itemValue="#{n.id}"
                                   itemLabel="Nr. #{n.id} - #{n.breitengrad} / #{n.laengengrad} (#{n.status.bezeichnung})"/>
                </h:selectOneMenu>
                <h:message for="netz" style="color:red"/>
            </div>

            <div class="formfeld">
                <h:outputLabel for="name" value="Ihr Name:"/>
                <h:inputText id="name" value="#{verschollenBean.melderName}"
                             required="true" requiredMessage="Bitte Ihren Namen angeben."/>
                <h:message for="name" style="color:red"/>
            </div>

            <p:commandButton value="Als verschollen melden"
                             action="#{verschollenBean.alsVerschollenMelden}" update="@form"/>
        </h:form>
    </ui:define>
</ui:composition>
