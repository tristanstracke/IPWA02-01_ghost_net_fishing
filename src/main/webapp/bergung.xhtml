<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template/layout.xhtml">

    <ui:param name="pageTitle" value="Bergung eintragen"/>

    <ui:define name="inhalt">
        <h2>Für eine Bergung eintragen</h2>

        <h:form>
            <div class="formfeld">
                <h:outputLabel for="netz" value="Netz:"/>
                <h:selectOneMenu id="netz" value="#{bergungEintragenBean.ausgewaehltesNetzId}"
                                 required="true" requiredMessage="Bitte ein Netz auswählen.">
                    <f:selectItem itemLabel="-- bitte wählen --" noSelectionOption="true"/>
                    <f:selectItems value="#{bergungEintragenBean.freieNetze}" var="n"
                                   itemValue="#{n.id}"
                                   itemLabel="Nr. #{n.id} - #{n.breitengrad} / #{n.laengengrad} (#{n.geschaetzteGroesse})"/>
                </h:selectOneMenu>
                <h:message for="netz" style="color:red"/>
            </div>

            <div class="formfeld">
                <h:outputLabel for="name" value="Ihr Name:"/>
                <h:inputText id="name" value="#{bergungEintragenBean.bergerName}"
                             required="true" requiredMessage="Bitte Ihren Namen angeben."/>
                <h:message for="name" style="color:red"/>
            </div>

            <div class="formfeld">
                <h:outputLabel for="tel" value="Telefonnummer:"/>
                <h:inputText id="tel" value="#{bergungEintragenBean.bergerTelefon}"
                             required="true" requiredMessage="Bitte eine Telefonnummer für Rückfragen angeben."/>
                <h:message for="tel" style="color:red"/>
            </div>

            <p:commandButton value="Bergung eintragen" action="#{bergungEintragenBean.eintragen}"
                             update="@form"/>
        </h:form>
    </ui:define>
</ui:composition>
