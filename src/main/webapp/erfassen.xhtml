<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template/layout.xhtml">

    <ui:param name="pageTitle" value="Netz melden"/>

    <ui:define name="inhalt">
        <h2>Geisternetz melden</h2>

        <h:form>
            <div class="formfeld">
                <h:outputLabel for="breite" value="Breitengrad:"/>
                <h:inputText id="breite" value="#{geisternetzErfassenBean.breitengrad}"
                             required="true" requiredMessage="Bitte Breitengrad angeben.">
                    <f:convertNumber maxFractionDigits="6"/>
                </h:inputText>
                <h:message for="breite" style="color:red"/>
            </div>

            <div class="formfeld">
                <h:outputLabel for="laenge" value="Längengrad:"/>
                <h:inputText id="laenge" value="#{geisternetzErfassenBean.laengengrad}"
                             required="true" requiredMessage="Bitte Längengrad angeben.">
                    <f:convertNumber maxFractionDigits="6"/>
                </h:inputText>
                <h:message for="laenge" style="color:red"/>
            </div>

            <div class="formfeld">
                <h:outputLabel for="groesse" value="Geschätzte Größe:"/>
                <h:inputText id="groesse" value="#{geisternetzErfassenBean.geschaetzteGroesse}"
                             required="true" requiredMessage="Bitte die geschätzte Größe angeben."/>
                <h:message for="groesse" style="color:red"/>
            </div>

            <h3>Meldende Person (optional)</h3>
            <p class="hinweis">Felder leer lassen für eine anonyme Meldung.</p>

            <div class="formfeld">
                <h:outputLabel for="mname" value="Name:"/>
                <h:inputText id="mname" value="#{geisternetzErfassenBean.melderName}"/>
            </div>

            <div class="formfeld">
                <h:outputLabel for="mtel" value="Telefonnummer:"/>
                <h:inputText id="mtel" value="#{geisternetzErfassenBean.melderTelefon}"/>
            </div>

            <p:commandButton value="Netz melden" action="#{geisternetzErfassenBean.erfassen}"
                             update="@form"/>
        </h:form>
    </ui:define>
</ui:composition>
